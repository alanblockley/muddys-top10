<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Data Viewer - Muddy's Top 10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: #0a0e1a;
            color: #e4e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.3);
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3));
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
            text-align: center;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-links a {
            padding: 10px 20px;
            background: #1e293b;
            color: #a5b4fc;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .nav-links a:hover {
            background: #334155;
            color: #e4e8f0;
        }

        .controls {
            background: #141b2d;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .controls label {
            margin-right: 10px;
            color: #94a3b8;
        }

        .controls input, .controls select {
            padding: 8px 12px;
            background: #0a0e1a;
            border: 1px solid #334155;
            color: #e4e8f0;
            border-radius: 6px;
            margin-right: 15px;
            font-family: 'Courier New', Courier, monospace;
        }

        .controls button {
            padding: 8px 20px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .controls button:hover {
            opacity: 0.9;
        }

        .data-table {
            background: #141b2d;
            border: 1px solid #1e293b;
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #1e293b;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #a5b4fc;
            border-bottom: 2px solid #334155;
        }

        tbody tr {
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #1e293b;
        }

        tbody tr.expanded {
            background: #1e293b;
        }

        td {
            padding: 12px 15px;
            color: #e4e8f0;
        }

        .timestamp {
            font-family: 'Courier New', Courier, monospace;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .track-original {
            color: #fbbf24;
        }

        .track-canonical {
            color: #10b981;
        }

        .validation-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .validation-validated {
            background: #10b98133;
            color: #10b981;
        }

        .validation-unvalidated {
            background: #94a3b833;
            color: #94a3b8;
        }

        .validation-promotional {
            background: #8b5cf633;
            color: #a5b4fc;
        }

        .validation-error {
            background: #ef444433;
            color: #ef4444;
        }

        .json-viewer {
            padding: 15px;
            background: #0a0e1a;
            border-top: 1px solid #334155;
            display: none;
        }

        .json-viewer.visible {
            display: block;
        }

        .json-content {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            color: #94a3b8;
            overflow-x: auto;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-box {
            flex: 1;
            background: #141b2d;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #6366f1;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .expand-icon {
            color: #6366f1;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="assets/muddys-logo.png" alt="Muddy's Music Cafe" class="logo">
            </div>
            <h1>Raw Data Viewer</h1>
            <p class="subtitle">Database Records</p>
        </header>

        <div class="nav-links">
            <a href="index.html">← Top 10</a>
            <a href="admin.html">Admin Panel</a>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat-box">
                <div class="stat-value" id="totalTracks">-</div>
                <div class="stat-label">Total Tracks</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="validatedCount">-</div>
                <div class="stat-label">Validated</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="unvalidatedCount">-</div>
                <div class="stat-label">Unvalidated</div>
            </div>
        </div>

        <div class="controls">
            <label>Limit:</label>
            <select id="limitSelect">
                <option value="50">50</option>
                <option value="100" selected>100</option>
                <option value="250">250</option>
                <option value="500">500</option>
            </select>

            <label>Filter:</label>
            <input type="text" id="searchInput" placeholder="Search track name...">

            <button onclick="loadData()">Refresh</button>
        </div>

        <div class="data-table">
            <table>
                <thead>
                    <tr>
                        <th style="width: 30px;"></th>
                        <th style="width: 180px;">Timestamp</th>
                        <th>Original Track</th>
                        <th>Canonical Track</th>
                        <th style="width: 120px;">Status</th>
                        <th style="width: 120px;">Confidence</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <tr>
                        <td colspan="6" class="loading">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // API endpoint will be injected during deployment
        const API_BASE = '%%API_ENDPOINT%%';

        let allData = [];
        let accessToken = null;

        // Check for auth token - REQUIRED for data viewer
        function checkAuth() {
            const urlParams = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(window.location.hash.substring(1));

            // Use same key as admin.html ('accessToken' not 'access_token')
            accessToken = localStorage.getItem('accessToken') ||
                         urlParams.get('id_token') ||
                         hashParams.get('id_token');

            // Redirect to admin login if not authenticated
            if (!accessToken) {
                alert('Authentication required. Redirecting to admin panel...');
                window.location.href = 'admin.html';
                return false;
            }
            return true;
        }

        async function loadData() {
            const limit = document.getElementById('limitSelect').value;
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="loading">Loading data...</td></tr>';

            try {
                const headers = {};
                if (accessToken) {
                    headers['Authorization'] = accessToken;
                }

                const response = await fetch(`${API_BASE}/history`, { headers });

                if (!response.ok) {
                    // If unauthorized, redirect to admin login
                    if (response.status === 401 || response.status === 403) {
                        alert('Session expired. Redirecting to admin panel...');
                        localStorage.removeItem('accessToken');
                        window.location.href = 'admin.html';
                        return;
                    }
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                // Flatten all tracks from all blocks
                allData = [];
                for (const block of data.blocks) {
                    for (const track of block.tracks) {
                        allData.push(track);
                    }
                }

                // Sort by timestamp descending (newest first)
                allData.sort((a, b) => b.timestamp - a.timestamp);

                // Apply limit
                const limitedData = allData.slice(0, parseInt(limit));

                renderTable(limitedData);
                updateStats();

            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="6" class="loading" style="color: #ef4444;">Error: ${error.message}</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('dataTableBody');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            // Filter by search term
            let filteredData = data;
            if (searchTerm) {
                filteredData = data.filter(track =>
                    track.track.toLowerCase().includes(searchTerm) ||
                    (track.raw_track && track.raw_track.toLowerCase().includes(searchTerm))
                );
            }

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading">No tracks found</td></tr>';
                return;
            }

            let html = '';
            filteredData.forEach((track, index) => {
                const rowId = `row-${index}`;
                const jsonId = `json-${index}`;

                const date = new Date(track.formatted_time);
                const dateStr = date.toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric',
                    timeZone: 'America/Los_Angeles'
                });
                const timeStr = date.toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    timeZone: 'America/Los_Angeles'
                });

                const validationStatus = track.validation_status || 'unvalidated';
                const confidence = track.validation_confidence || '-';

                html += `
                    <tr id="${rowId}" onclick="toggleJson('${jsonId}', '${rowId}')">
                        <td><span class="expand-icon">▶</span></td>
                        <td class="timestamp">${dateStr}<br>${timeStr} PST</td>
                        <td class="track-original">${escapeHtml(track.raw_track || track.track)}</td>
                        <td class="track-canonical">${escapeHtml(track.track)}</td>
                        <td><span class="validation-badge validation-${validationStatus}">${validationStatus}</span></td>
                        <td>${confidence}</td>
                    </tr>
                    <tr>
                        <td colspan="6" style="padding: 0;">
                            <div class="json-viewer" id="${jsonId}">
                                <div class="json-content">${escapeHtml(JSON.stringify(track, null, 2))}</div>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        function toggleJson(jsonId, rowId) {
            const jsonDiv = document.getElementById(jsonId);
            const row = document.getElementById(rowId);
            const icon = row.querySelector('.expand-icon');

            if (jsonDiv.classList.contains('visible')) {
                jsonDiv.classList.remove('visible');
                row.classList.remove('expanded');
                icon.textContent = '▶';
            } else {
                jsonDiv.classList.add('visible');
                row.classList.add('expanded');
                icon.textContent = '▼';
            }
        }

        function updateStats() {
            const total = allData.length;
            const validated = allData.filter(t => t.validation_status === 'validated').length;
            const unvalidated = allData.filter(t => !t.validation_status || t.validation_status === 'unvalidated').length;

            document.getElementById('totalTracks').textContent = total;
            document.getElementById('validatedCount').textContent = validated;
            document.getElementById('unvalidatedCount').textContent = unvalidated;
            document.getElementById('stats').style.display = 'flex';
        }

        function escapeHtml(text) {
            if (typeof text !== 'string') text = String(text);
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Add search functionality
        document.getElementById('searchInput').addEventListener('input', () => {
            const limit = document.getElementById('limitSelect').value;
            const limitedData = allData.slice(0, parseInt(limit));
            renderTable(limitedData);
        });

        // Initialize - check auth first
        if (checkAuth()) {
            loadData();
        }
    </script>
</body>
</html>
