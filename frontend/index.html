<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muddy's Music Cafe - Top 10</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            padding: 20px;
            color: #e4e8f0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: linear-gradient(180deg, #12172a 0%, #0d1120 100%);
            border-radius: 20px;
            box-shadow: 0 20px 80px rgba(0,0,0,0.6);
            overflow: hidden;
            border: 1px solid rgba(99, 102, 241, 0.1);
        }
        header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            padding: 40px 40px 50px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.5;
        }
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }
        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-size: 3em;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: -1px;
            position: relative;
            z-index: 1;
        }
        .subtitle {
            font-size: 1.1em;
            font-weight: 400;
            opacity: 0.95;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
            text-transform: uppercase;
            font-size: 0.9em;
        }
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(18, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            padding: 16px 24px;
        }
        nav .nav-title {
            flex: 1;
            font-size: 1.1em;
            font-weight: 600;
            color: #e4e8f0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        nav .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        nav a {
            padding: 10px 24px;
            border-radius: 8px;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        nav a:hover {
            background: rgba(99, 102, 241, 0.25);
            color: #e4e8f0;
            transform: translateY(-2px);
        }
        .content {
            padding: 40px;
            min-height: 400px;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: #9ca3af;
            font-size: 1.1em;
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            padding: 20px 24px;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .hidden { display: none !important; }
        .auth-container {
            max-width: 520px;
            margin: 0 auto;
            padding: 40px;
            text-align: center;
        }
        .auth-card {
            background: rgba(18, 23, 42, 0.9);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 20px 80px rgba(0,0,0,0.6);
        }
        .auth-card h2 {
            color: #ffffff;
            margin-bottom: 12px;
        }
        .auth-card p {
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .auth-button {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* History Styles */
        .time-block {
            margin-bottom: 24px;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(18, 23, 42, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .block-header {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.15));
            padding: 16px 24px;
            font-weight: 700;
            color: #e4e8f0;
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            letter-spacing: 0.5px;
            font-size: 0.95em;
        }
        .track-list { padding: 0; }
        .track-item {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(99, 102, 241, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }
        .track-item:last-child { border-bottom: none; }
        .track-item:hover {
            background: rgba(99, 102, 241, 0.08);
            padding-left: 32px;
        }
        .track-name {
            font-weight: 500;
            color: #e4e8f0;
            font-size: 0.95em;
        }
        .track-time {
            color: #9ca3af;
            font-size: 0.85em;
            font-variant-numeric: tabular-nums;
        }

        /* Top 10 Styles */
        .top10-list { list-style: none; }
        .top10-item {
            display: flex;
            align-items: center;
            padding: 24px;
            margin-bottom: 16px;
            background: rgba(18, 23, 42, 0.6);
            border-radius: 16px;
            border-left: 4px solid #6366f1;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(99, 102, 241, 0.15);
        }
        .top10-item:hover {
            transform: translateX(8px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3);
            border-left-color: #8b5cf6;
            background: rgba(18, 23, 42, 0.8);
        }
        .rank {
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            width: 80px;
            text-align: center;
        }
        .track-info {
            flex: 1;
            padding: 0 24px;
        }
        .track-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #e4e8f0;
            margin-bottom: 6px;
        }
        .play-count {
            color: #9ca3af;
            font-size: 0.9em;
        }
        .movement {
            width: 100px;
            text-align: center;
            font-weight: 700;
            font-size: 0.95em;
        }
        .movement.up {
            color: #10b981;
        }
        .movement.down {
            color: #ef4444;
        }
        .movement.same {
            color: #6b7280;
        }
        .movement.new {
            color: #8b5cf6;
            animation: pulse 2s infinite;
        }
        .movement-icon {
            display: inline-block;
            margin-right: 4px;
            font-size: 1.2em;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .chart-info {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.15));
            padding: 20px 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: center;
            color: #e4e8f0;
            border: 1px solid rgba(99, 102, 241, 0.2);
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .download-btn {
            padding: 10px 24px;
            border-radius: 8px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
            cursor: pointer;
        }
        .download-btn:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        .signout-btn {
            background: #1e293b;
        }
        .signout-btn:hover {
            background: #334155;
            box-shadow: none;
        }
        #downloadCanvas {
            display: none;
        }
    </style>
</head>
<body>
    <div id="authContainer" class="auth-container">
        <div class="auth-card">
            <img src="assets/muddys-logo.png" alt="Muddy's Music Cafe" class="logo" style="margin-bottom: 18px;">
            <h2>Muddy's Music Cafe</h2>
            <p>Sign in to view the Top 10 chart and station data.</p>
            <button onclick="login()" class="auth-button">Sign In</button>
        </div>
    </div>

    <div id="appContainer" class="container hidden">
        <header>
            <div class="logo-container">
                <img src="assets/muddys-logo.png" alt="Muddy's Music Cafe" class="logo">
            </div>
            <h1>Muddy's Music Cafe</h1>
            <p class="subtitle">Top Tracks Tracker</p>
        </header>
        <nav>
            <div class="nav-title">📻 Top 10 This Week</div>
            <div class="nav-actions">
                <button id="downloadBtn" class="download-btn" onclick="downloadInfographic()" style="display: none;">
                    📥 Download for Social Media
                </button>
                <a href="admin.html">Admin</a>
                <button onclick="logout()" class="download-btn signout-btn">Sign Out</button>
            </div>
        </nav>
        <div class="content">
            <div id="view-top10"></div>
        </div>
    </div>

    <canvas id="downloadCanvas"></canvas>

    <script>
        // API endpoint will be injected during deployment
        const API_BASE = '%%API_ENDPOINT%%';
        const CONFIG = {
            cognitoConfig: {
                userPoolId: '%%USER_POOL_ID%%',
                clientId: '%%CLIENT_ID%%',
                domain: '%%COGNITO_DOMAIN%%',
                redirectUri: window.location.origin + '/index.html'
            }
        };

        // Store top10 data globally for download
        let currentTop10Data = null;
        let accessToken = null;

        function login() {
            const authUrl = `${CONFIG.cognitoConfig.domain}/oauth2/authorize?` +
                `client_id=${CONFIG.cognitoConfig.clientId}&` +
                `response_type=token&` +
                `scope=email+openid+profile&` +
                `redirect_uri=${encodeURIComponent(CONFIG.cognitoConfig.redirectUri)}`;
            window.location.href = authUrl;
        }

        function logout() {
            localStorage.removeItem('accessToken');
            accessToken = null;
            const logoutUrl = `${CONFIG.cognitoConfig.domain}/logout?` +
                `client_id=${CONFIG.cognitoConfig.clientId}&` +
                `logout_uri=${encodeURIComponent(CONFIG.cognitoConfig.redirectUri)}`;
            window.location.href = logoutUrl;
        }

        function checkAuth() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);

            if (params.has('id_token')) {
                accessToken = params.get('id_token');
                localStorage.setItem('accessToken', accessToken);
                window.history.replaceState({}, document.title, window.location.pathname);
            } else {
                accessToken = localStorage.getItem('accessToken');
            }

            if (!accessToken) return false;

            try {
                const payload = JSON.parse(atob(accessToken.split('.')[1]));
                if (payload.exp * 1000 > Date.now()) {
                    return true;
                }
            } catch (error) {
                // Fall through to token cleanup.
            }

            localStorage.removeItem('accessToken');
            accessToken = null;
            return false;
        }

        function showAuthenticatedApp() {
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            loadTop10();
        }

        async function loadTop10() {
            const container = document.getElementById('view-top10');
            container.innerHTML = '<div class="loading">Loading Top 10...</div>';

            try {
                const response = await fetch(API_BASE + '/top10', {
                    headers: {
                        'Authorization': accessToken
                    }
                });
                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('accessToken');
                    accessToken = null;
                    document.getElementById('appContainer').classList.add('hidden');
                    document.getElementById('authContainer').classList.remove('hidden');
                    return;
                }
                if (!response.ok) throw new Error('Failed to load Top 10');
                const data = await response.json();

                // Store data for download
                currentTop10Data = data;

                let html = `
                    <div class="chart-info">
                        Chart Period: ${new Date(data.week_start).toLocaleDateString()} -
                        ${new Date(data.week_end).toLocaleDateString()}
                    </div>
                    <ul class="top10-list">
                `;

                for (const item of data.top10) {
                    const movementIcon = {
                        'up': '↑',
                        'down': '↓',
                        'same': '−',
                        'new': '★'
                    }[item.movement];

                    const movementText = item.movement === 'new' ? 'NEW' :
                        item.movement === 'same' ? 'SAME' :
                        Math.abs(item.movement_delta || 0);

                    html += `
                        <li class="top10-item">
                            <div class="rank">#${item.rank}</div>
                            <div class="track-info">
                                <div class="track-title">${escapeHtml(item.track)}</div>
                                <div class="play-count">${item.play_count} plays</div>
                            </div>
                            <div class="movement ${item.movement}">
                                <span class="movement-icon">${movementIcon}</span>
                                ${movementText}
                            </div>
                        </li>
                    `;
                }

                html += '</ul>';
                container.innerHTML = html;

                // Show download button
                document.getElementById('downloadBtn').style.display = 'inline-block';
            } catch (error) {
                container.innerHTML = '<div class="error">Error loading Top 10: ' + error.message + '</div>';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function downloadInfographic() {
            if (!currentTop10Data) {
                alert('No data available to download');
                return;
            }

            const canvas = document.getElementById('downloadCanvas');
            const ctx = canvas.getContext('2d');

            // Set canvas size for Instagram post (1080x1350)
            canvas.width = 1080;
            canvas.height = 1350;

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#6366f1');
            gradient.addColorStop(1, '#8b5cf6');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid pattern overlay
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.fillRect(i, 0, 1, canvas.height);
            }
            for (let i = 0; i < canvas.height; i += 20) {
                ctx.fillRect(0, i, canvas.width, 1);
            }

            // Load and draw logo
            const logo = new Image();
            logo.src = 'assets/muddys-logo.png';

            await new Promise((resolve) => {
                logo.onload = resolve;
            });

            // Draw logo at top
            const logoSize = 180;
            ctx.drawImage(logo, (canvas.width - logoSize) / 2, 60, logoSize, logoSize);

            // Title
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 60px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText("Muddy's Music Cafe", canvas.width / 2, 300);

            ctx.font = '32px Arial, sans-serif';
            ctx.fillText("TOP 10 THIS WEEK", canvas.width / 2, 350);

            // Date range
            ctx.font = '24px Arial, sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            const startDate = new Date(currentTop10Data.week_start).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const endDate = new Date(currentTop10Data.week_end).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            ctx.fillText(`${startDate} - ${endDate}`, canvas.width / 2, 390);

            // Draw top 10 list
            let y = 460;
            const lineHeight = 80;
            const leftMargin = 60;

            ctx.textAlign = 'left';

            for (const item of currentTop10Data.top10) {
                // Background box for each item
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.fillRect(40, y - 50, canvas.width - 80, 70);

                // Rank badge
                ctx.fillStyle = '#10b981';
                ctx.fillRect(leftMargin, y - 40, 60, 60);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 36px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(item.rank, leftMargin + 30, y - 5);

                // Track name
                ctx.textAlign = 'left';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 28px Arial, sans-serif';

                // Truncate track name if too long
                let trackName = item.track;
                const maxWidth = 720;
                let metrics = ctx.measureText(trackName);
                if (metrics.width > maxWidth) {
                    while (metrics.width > maxWidth && trackName.length > 0) {
                        trackName = trackName.substring(0, trackName.length - 1);
                        metrics = ctx.measureText(trackName + '...');
                    }
                    trackName += '...';
                }
                ctx.fillText(trackName, leftMargin + 80, y - 20);

                // Play count
                ctx.font = '20px Arial, sans-serif';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.fillText(`${item.play_count} plays`, leftMargin + 80, y + 10);

                // Movement indicator
                const movementColors = {
                    'up': '#10b981',
                    'down': '#ef4444',
                    'same': '#6b7280',
                    'new': '#fbbf24'
                };
                const movementIcons = {
                    'up': '↑',
                    'down': '↓',
                    'same': '−',
                    'new': '★'
                };

                ctx.fillStyle = movementColors[item.movement];
                ctx.font = 'bold 32px Arial, sans-serif';
                ctx.textAlign = 'right';
                const movementText = item.movement === 'new' ? 'NEW' :
                    item.movement === 'same' ? '' :
                    Math.abs(item.movement_delta || 0);
                ctx.fillText(`${movementIcons[item.movement]} ${movementText}`, canvas.width - leftMargin, y - 5);

                y += lineHeight;
            }

            // Footer
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '20px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Based on DJ plays & listener requests', canvas.width / 2, canvas.height - 40);

            // Download
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `muddys-top10-${new Date().toISOString().split('T')[0]}.png`;
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        if (checkAuth()) {
            showAuthenticatedApp();
        }
    </script>
</body>
</html>
